<div class="product-box">
<a style="all:unset;cursor: pointer;" href="{{ url_for('general.product_page', id=p.id, name=p.name) }}">
    <section>
                    <img src="{{ url_for('static', filename='cover/' ~ p.id ~ '.jpg') }}" alt="{{ p.name }}">
                    <span class="tag red"><img src="{{ url_for("static", filename = "theme-image/delivery.png" ) }}">ارسال رایگان</span>
                    <span class="tag blue"><img src="{{ url_for("static", filename = "theme-image/done.png" ) }}">ضمانت اصالت</span>
                    <h3>{{ p.name }}</h3>
                    <p>{{ p.description|truncate(60) }}</p>
                    <span class="price">{{ p.price }}</span>
                    
    </section>
</a>


    <a class="add-to-cart-btn" href="/add-to-cart?id={{ p.id }}">افزودن به <img
        src="{{ url_for("static", filename = "theme-image/cart.png" ) }}"></a>

    </div>
